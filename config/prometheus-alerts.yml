groups:
  - name: myfolio
    rules:
      - alert: MyFolioRiskReview
        expr: portfolio_news_review_total{action="risk"} > 0
        for: 5m
        labels:
          severity: warning
          service: myfolio
        annotations:
          summary: MyFolio has a risk-review news signal
          description: Review the Alerts page and linked news articles before taking action.

      - alert: MyFolioPortfolioLoss
        expr: portfolio_total_pnl < -10000
        for: 5m
        labels:
          severity: warning
          service: myfolio
        annotations:
          summary: MyFolio portfolio loss threshold crossed
          description: Portfolio total P&L is below the configured INR 10,000 loss threshold.
